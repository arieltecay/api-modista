<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f4f4f4;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #8a2be2;
      font-size: 24px;
    }

    p {
      line-height: 1.6;
      color: #333;
    }

    strong {
      color: #555;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Tu nota de crédito, {{name}}</h1>
    <p>
      Hola {{name}},
    </p>
    <p>
      Emitimos una nota de crédito oficial (ARCA) que anula la factura de tu curso <strong>"{{courseTitle}}"</strong>.
    </p>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 24px 0;">
      <tr>
        <td align="center" bgcolor="#5b21b6" style="background-color: #5b21b6; border-radius: 8px;">
          <a href="{{creditNoteUrl}}" target="_blank" style="display: inline-block; padding: 16px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; line-height: 1; color: #ffffff !important; text-decoration: none; border-radius: 8px;"><span style="color: #ffffff;">Ver la nota de crédito &rarr;</span></a>
        </td>
      </tr>
    </table>
    <p>
      Desde esa página podés imprimirla o guardarla como PDF. Si tenés alguna duda, respondé este mail.
    </p>
    <div class="footer">
      &copy; {{year}} Modista App
    </div>
  </div>
</body>

</html>
